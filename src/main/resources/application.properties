# ========================================================
# Cấu hình Spring Boot JWT với Nimbus JOSE + JWT
# ========================================================

spring.application.name=jwt-nimbus-auth
server.port=8005

# ========================================================
# CẤU HÌNH MICROSOFT SQL SERVER 
# ========================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AjaxRestfulDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456

# Driver cho SQL Server (Dùng Microsoft SQL Server Driver để kết nối đúng chuẩn URL jdbc:sqlserver)
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver (chỉ dùng khi đổi URL sang jdbc:mysql)

# Hibernate Dialect SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================================
# CẤU HÌNH JWT NIMBUS (HS256 yêu cầu secret key >= 256-bit)
# ========================================================
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# Thời gian sống của Token: 1 giờ = 3600000 ms
security.jwt.expiration-time=3600000
